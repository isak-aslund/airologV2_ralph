services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - FLIGHT_LOG_DEBUG=false
      - FLIGHT_LOG_DATABASE_PATH=/app/data/flight_logs.db
      - FLIGHT_LOG_UPLOAD_DIR=/app/data/logs
      - FLIGHT_LOG_IMG_DIR=/app/img
    volumes:
      - /mnt/data/airolog-data:/app/data
      - /mnt/data/airolog-img:/app/img

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/data/airolog-certs:/etc/nginx/certs
      - /mnt/data/airolog-img:/usr/share/nginx/img:ro
    depends_on:
      - backend
